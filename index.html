function settings(){$('#settingsView').innerHTML=`${head('شخصی‌سازی و پشتیبان','تنظیمات')}<div class="grid g2"><div class="panel"><h2>تنظیمات مالی</h2>${setting('واحد پول','مثلاً تومان یا ریال','currency',state.settings.currency)}${setting('موجودی شروع','پولی که قبل از ثبت‌ها داشتی','start',state.settings.startingBalance)}${setting('بودجه ماهانه','حداکثر خرج مطلوب','budget',state.settings.budget)}<button class="btn primary" style="width:100%;margin-top:14px" onclick="saveSettings()">ذخیره تنظیمات</button></div><div class="panel"><h2>پشتیبان اطلاعات</h2><p class="muted" style="line-height:1.9">اطلاعات روی همین دستگاه ذخیره می‌شود. قبل از پاک‌کردن داده‌های مرورگر یا تعویض گوشی، فایل پشتیبان بگیر.</p><div class="actions"><button class="btn" onclick="exportData()">دریافت پشتیبان</button><label class="btn">بازیابی فایل<input hidden type="file" accept="application/json" onchange="importData(this.files[0])"></label></div></div><div class="panel"><h2>ظاهر</h2><button class="btn" onclick="theme()">تغییر حالت روشن و تاریک</button></div><div class="panel" style="border-color:color-mix(in srgb,var(--red) 35%,var(--line))"><h2>پاک‌سازی</h2><p class="muted">همهٔ تراکنش‌ها، بدهی‌ها و اقساط حذف می‌شوند.</p><button class="btn danger" onclick="clearData()">پاک کردن همه اطلاعات</button></div></div>`}function setting(a,b,id,val){return `<div class="setting"><div class="grow"><b>${a}</b><div class="sub">${b}</div></div><input id="${id}" inputmode="numeric" value="${esc(val||0)}"></div>`}
function mh(t){return `<div class="modalhead"><h2>${t}</h2><button class="icon" onclick="closeModal()" aria-label="بستن">${icon('close')}</button></div>`}function modal(h){$('#modalBox').innerHTML=h;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open');$('#modalBox').innerHTML=''}function opts(s=''){return CATS.map(c=>`<option ${c===s?'selected':''}>${c}</option>`).join('')}
function openTx(type='expense',id=''){let old=id?state.transactions.find(x=>x.id===id):null;type=old?.type||type;modal(`${mh(old?'ویرایش تراکنش':'ثبت سریع')}<div class="tabs"><button class="${type==='expense'?'active':''}" onclick="openTx('expense','${id}')">خرج</button><button class="${type==='income'?'active':''}" onclick="openTx('income','${id}')">درآمد</button></div><form id="txForm"><input name="type" type="hidden" value="${type}"><div class="field"><label>مبلغ (${esc(state.settings.currency)})</label><input name="amount" inputmode="numeric" value="${old?.amount||''}" required></div><div class="field"><label>برای چه چیزی؟</label><input name="title" value="${esc(old?.title||'')}" placeholder="مثلاً خرید سوپرمارکت" required></div><div class="formgrid"><div class="field"><label>دسته</label><select name="category">${opts(old?.category||(type==='income'?'درآمد':'سایر'))}</select></div><div class="field"><label>تاریخ شمسی</label><input name="date" inputmode="numeric" dir="ltr" value="${jInput(old?.date||today())}" placeholder="۱۴۰۵/۰۷/۱۷" required></div></div><div class="field"><label>یادداشت اختیاری</label><input name="note" value="${esc(old?.note||'')}"></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">انصراف</button><button class="btn primary">ذخیره</button></div></form>`);$('#txForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),iso=parseJDate(f.get('date'));if(!iso)return note('تاریخ شمسی معتبر نیست؛ نمونه: ۱۴۰۵/۰۷/۱۷');let o={id:old?.id||uid(),type:f.get('type'),amount:amount(f.get('amount')),title:f.get('title').trim(),category:f.get('category'),date:iso,note:f.get('note').trim(),sourceId:old?.sourceId||'',createdAt:old?.createdAt||new Date().toISOString()};if(!o.amount)return note('مبلغ را درست وارد کن');await put('transactions',o);old?state.transactions=state.transactions.map(x=>x.id===o.id?o:x):state.transactions.push(o);closeModal();render();note('تراکنش ذخیره شد')}}
function txMenu(id){let x=state.transactions.find(t=>t.id===id);if(!x)return;let linked=!!x.sourceId;modal(`${mh('مدیریت تراکنش')}<div class="panel" style="box-shadow:none"><b>${esc(x.title)}</b><div class="obamount ${x.type==='expense'?'neg':x.type==='income'?'pos':''}">${x.type==='expense'?'−':x.type==='income'?'+':''}${num(x.amount)}</div><div class="sub">${date(x.date)} · ${esc(x.category||'سایر')}</div></div>${linked?'<div class="hint">این تراکنش به یک قسط یا بدهی متصل است. برای اصلاح مبلغ، آن را حذف و پرداخت را دوباره ثبت کن.</div>':''}<div class="formactions">${linked?'':`<button class="btn" onclick="closeModal();openTx('${x.type}','${x.id}')">ویرایش</button>`}<button class="btn danger" onclick="deleteTx('${x.id}')">حذف</button></div>`)}async function deleteTx(id){let t=state.transactions.find(x=>x.id===id);if(!t||!confirm('این تراکنش حذف شود؟'))return;if(t.sourceId){let debt=state.debts.find(x=>x.id===t.sourceId),installment=state.installments.find(x=>x.id===t.sourceId);if(debt){debt.remaining=Math.min(+debt.total,+debt.remaining+ +t.amount);debt.status='active';await put('debts',debt)}if(installment){let wasDone=installment.status==='done';installment.paidCount=Math.max(0,+installment.paidCount-1);installment.status='active';if(!wasDone&&installment.nextDueDate)installment.nextDueDate=changeJMonth(installment.nextDueDate,-1);await put('installments',installment)}}await remove('transactions',id);state.transactions=state.transactions.filter(x=>x.id!==id);closeModal();render();note('تراکنش حذف شد و مانده‌ها اصلاح شدند')}
function changeJMonth(s,n){let p=jParts(s),total=p.jy*12+p.jm-1+n,jy=Math.floor(total/12),jm=total%12+1,jd=Math.min(p.jd,jMonthLength(jy,jm));return jToISO(jy,jm,jd)}function addMonth(s){return changeJMonth(s,1)}
function installmentModal(id=''){let old=id?state.installments.find(x=>x.id===id):null;modal(`${mh(old?'ویرایش قسط':'قسط جدید')}<form id="if"><div class="field"><label>عنوان قسط</label><input name="title" value="${esc(old?.title||'')}" placeholder="مثلاً وام موتور" required></div><div class="formgrid"><div class="field"><label>مبلغ هر قسط</label><input name="amount" inputmode="numeric" value="${old?.amount||''}" required></div><div class="field"><label>تعداد کل</label><input name="count" inputmode="numeric" value="${old?.count||12}" required></div></div><div class="formgrid"><div class="field"><label>پرداخت‌شده</label><input name="paid" inputmode="numeric" value="${old?.paidCount||0}"></div><div class="field"><label>سررسید بعدی (شمسی)</label><input name="due" inputmode="numeric" dir="ltr" value="${jInput(old?.nextDueDate||today())}" placeholder="۱۴۰۵/۰۷/۱۷" required></div></div><div class="hint">با ثبت پرداخت، خرج قسط خودکار ثبت و سررسید یک ماه شمسی جلو می‌رود.</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">انصراف</button><button class="btn primary">ذخیره قسط</button></div></form>`);$('#if').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),dueISO=parseJDate(f.get('due'));if(!dueISO)return note('سررسید شمسی معتبر نیست');let count=amount(f.get('count')),paid=Math.min(count,amount(f.get('paid'))),installmentAmount=amount(f.get('amount'));if(!installmentAmount||count<1)return note('مبلغ و تعداد اقساط باید بیشتر از صفر باشد');let o={id:old?.id||uid(),title:f.get('title').trim(),amount:installmentAmount,count,paidCount:paid,nextDueDate:dueISO,status:paid>=count?'done':'active',createdAt:old?.createdAt||new Date().toISOString()};await put('installments',o);old?state.installments=state.installments.map(x=>x.id===o.id?o:x):state.installments.push(o);closeModal();render();note('قسط ذخیره شد')}}
function payInstallment(id){let x=state.installments.find(o=>o.id===id);if(!x)return;modal(`${mh('ثبت پرداخت قسط')}<form id="ip"><div class="hint">${esc(x.title)} · قسط ${num(+x.paidCount+1)} از ${num(x.count)}</div><div class="field"><label>مبلغ پرداختی</label><input name="amount" inputmode="numeric" value="${x.amount}" required></div><div class="field"><label>تاریخ پرداخت (شمسی)</label><input name="date" inputmode="numeric" dir="ltr" value="${jInput(today())}" placeholder="۱۴۰۵/۰۷/۱۷" required></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">انصراف</button><button class="btn primary">ثبت پرداخت</button></div></form>`);$('#ip').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),paidISO=parseJDate(f.get('date')),payment=amount(f.get('amount'));if(!paidISO)return note('تاریخ پرداخت شمسی معتبر نیست');if(!payment)return note('مبلغ پرداخت باید بیشتر از صفر باشد');let tx={id:uid(),title:'قسط: '+x.title,amount:payment,type:'expense',category:'قسط',date:paidISO,note:`قسط ${+x.paidCount+1} از ${x.count}`,sourceId:x.id,createdAt:new Date().toISOString()};x.paidCount=+x.paidCount+1;x.status=x.paidCount>=+x.count?'done':'active';x.status!=='done'&&(x.nextDueDate=addMonth(x.nextDueDate));await put('transactions',tx);await put('installments',x);state.transactions.push(tx);closeModal();render();note(x.status==='done'?'اقساط تمام شد':'پرداخت ثبت شد')}}
function debtModal(id=''){let old=id?state.debts.find(x=>x.id===id):null;modal(`${mh(old?'ویرایش بدهی / طلب':'بدهی یا طلب جدید')}<form id="df"><div class="field"><label>نوع</label><div class="seg"><label><input type="radio" name="dir" value="owe" ${!old||old.direction==='owe'?'checked':''}><span>من بدهکارم</span></label><label><input type="radio" name="dir" value="receivable" ${old?.direction==='receivable'?'checked':''}><span>من طلبکارم</span></label></div></div><div class="field"><label>عنوان</label><input name="title" value="${esc(old?.title||'')}" required></div><div class="formgrid"><div class="field"><label>مبلغ کل</label><input name="total" inputmode="numeric" value="${old?.total||''}" required></div><div class="field"><label>باقی‌مانده</label><input name="remaining" inputmode="numeric" value="${old?.remaining??''}" placeholder="برابر مبلغ کل"></div></div><div class="formgrid"><div class="field"><label>طرف حساب</label><input name="person" value="${esc(old?.person||'')}"></div><div class="field"><label>سررسید شمسی</label><input name="due" inputmode="numeric" dir="ltr" value="${old?.dueDate?jInput(old.dueDate):''}" placeholder="اختیاری؛ مثلاً ۱۴۰۵/۰۸/۰۱"></div></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">انصراف</button><button class="btn primary">ذخیره</button></div></form>`);$('#df').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),dueISO=parseJDate(f.get('due'),true);if(f.get('due').trim()&&!dueISO)return note('سررسید شمسی معتبر نیست');let total=amount(f.get('total'));if(!total)return note('مبلغ کل باید بیشتر از صفر باشد');let rem=f.get('remaining')?amount(f.get('remaining')):total,o={id:old?.id||uid(),direction:f.get('dir'),title:f.get('title').trim(),total,remaining:Math.min(total,rem),person:f.get('person').trim(),dueDate:dueISO,status:rem<=0?'done':'active',createdAt:old?.createdAt||new Date().toISOString()};await put('debts',o);old?state.debts=state.debts.map(x=>x.id===o.id?o:x):state.debts.pus function payDebt(id){let x=state.debts.find(o=>o.id===id);if(!x)return;modal(`${mh(x.direction==='owe'?'ثبت پرداخت بدهی':'ثبت دریافت طلب')}<form id="dp"><div class="hint">مانده: ${num(x.remaining)} ${state.settings.currency}</div><div class="field"><label>مبلغ</label><input name="amount" inputmode="numeric" value="${x.remaining}" required></div><div class="field"><label>تاریخ شمسی</label><input name="date" inputmode="numeric" dir="ltr" value="${jInput(today())}" placeholder="۱۴۰۵/۰۷/۱۷" required></div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">انصراف</button><button class="btn primary">ثبت</button></div></form>`);$('#dp').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),paidISO=parseJDate(f.get('date'));if(!paidISO)return note('تاریخ شمسی معتبر نیست');let a=Math.min(amount(f.get('amount')),+x.remaining);if(!a)return note('مبلغ پرداخت باید بیشتر از صفر باشد');let tx={id:uid(),title:(x.direction==='owe'?'پرداخت بدهی: ':'دریافت طلب: ')+x.title,amount:a,type:x.direction==='owe'?'expense':'income',category:'بدهی',date:paidISO,note:x.person||'',sourceId:x.id,createdAt:new Date().toISOString()};x.remaining=Math.max(0,+x.remaining-a);x.status=x.remaining<=0?'done':'active';await put('transactions',tx);await put('debts',x);state.transactions.push(tx);closeModal();render();note(x.status==='done'?'کامل تسویه شد':'ثبت شد')}}
async function removeOb(store,id){if(!confirm('این مورد حذف شود؟ تراکنش‌های قبلی باقی می‌مانند.'))return;await remove(store,id);state[store]=state[store].filter(x=>x.id!==id);render();note('حذف شد')}
function budgetModal(){let fields=CATS.filter(c=>c!=='درآمد').map(c=>{let b=state.budgets.find(x=>x.month===key()&&x.category===c);return `<div class="field"><label>${c}</label><input name="c_${c}" inputmode="numeric" value="${b?.amount||''}" placeholder="بدون سقف"></div>`}).join('');modal(`${mh('بودجهٔ '+month(cursor))}<form id="bf"><div class="field"><label>سقف کل خرج ماه</label><input name="total" inputmode="numeric" value="${state.settings.budget||''}"></div><div class="hint">سقف دسته‌ها مخصوص ماه انتخاب‌شده است.</div><div class="formgrid">${fields}</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">انصراف</button><button class="btn primary">ذخیره بودجه</button></div></form>`);$('#bf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);state.settings.budget=amount(f.get('total'));await put('settings',state.settings);for(let c of CATS.filter(c=>c!=='درآمد')){let a=amount(f.get('c_'+c)),old=state.budgets.find(x=>x.month===key()&&x.category===c);if(a){let o={id:old?.id||uid(),month:key(),category:c,amount:a};await put('budgets',o);old?state.budgets=state.budgets.map(x=>x.id===o.id?o:x):state.budgets.push(o)}else if(old){await remove('budgets',old.id);state.budgets=state.budgets.filter(x=>x.id!==old.id)}}closeModal();render();note('بودجه ذخیره شد')}}
