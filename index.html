<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9db38a">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ORBIT">
  <meta name="application-name" content="ORBIT">
  <meta name="description" content="مدیریت شخصی درآمد، خرج، بودجه، قسط و بدهی با تقویم شمسی">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <title>ORBIT — مدیریت مالی شخصی</title>
  <script>
    /* تم ذخیره‌شده را پیش از رسم صفحه اعمال می‌کند تا چشمک نزند. */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('orbit_finance_v3') || 'null');
        var theme = saved && saved.settings && saved.settings.theme;
        var lang = saved && saved.settings && saved.settings.language === 'en' ? 'en' : 'fa';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
        if (lang === 'en') document.title = 'ORBIT — Personal Finance';
        if (theme !== 'dark' && theme !== 'light') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var crt = saved && saved.settings && saved.settings.crt;
        document.documentElement.setAttribute('data-crt', crt === 'off' || crt === 'soft' ? crt : 'full');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#060705' : '#9db38a';
      } catch (error) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2">
  <link rel="stylesheet" href="./styles.css?v=3.9.0">
</head>
<body>
  <div class="crt-fx" aria-hidden="true"><i class="crt-glow"></i><i class="crt-mask"></i><i class="crt-scan"></i><i class="crt-roll"></i><i class="crt-vig"></i><i class="crt-flick"></i></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">ORBIT<small data-t="مدیریت مالی شخصی">مدیریت مالی شخصی</small></div>
      <nav class="desktop-nav" id="desktopNav" aria-label="منوی اصلی" data-t-aria="منوی اصلی"></nav>
      <div class="sidebar-note"><span data-t="داده‌ها فقط روی همین دستگاه می‌مانند.">داده‌ها فقط روی همین دستگاه می‌مانند.</span><br><span data-t="از «تنظیمات» پشتیبان بگیر.">از «تنظیمات» پشتیبان بگیر.</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="today-chip" id="todayLabel" aria-live="polite"></div>
        <div class="topbar-brand" aria-hidden="true">ORBIT</div>
        <div class="top-actions">
          <button class="icon-button lang-key" id="langToggle" type="button" data-action="lang" aria-label="تغییر زبان به انگلیسی">EN</button>
          <button class="icon-button knob" id="themeToggle" type="button" data-action="theme" aria-label="تغییر حالت روشن و تاریک" data-t-aria="تغییر حالت روشن و تاریک"></button>
        </div>
      </header>

      <div class="content">
        <div id="storageWarning" class="warning" role="alert" hidden></div>
        <section id="screen"></section>
      </div>
    </main>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="منوی اصلی" data-t-aria="منوی اصلی"></nav>
  <div class="modal" id="confirmModal" aria-hidden="true"><div class="confirm-box" id="confirmBox" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="fatal">برای استفاده از ORBIT باید JavaScript مرورگر فعال باشد.<br>ORBIT needs JavaScript to be enabled.</div></noscript>
  <script src="./app.js?v=3.9.0" defer></script>
</body>
</html>
